services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Data Source=/data/feedback.db"
    volumes:
      - feedback-data:/data

volumes:
  feedback-data: